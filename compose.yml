
services:
  postgres:
    image: postgres:16-alpine
    container_name: AuctionHouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: AuctionHouse-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:?Defina POSTGRES_USER}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Defina POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      AUDITORIA_CHAVE_HEX: ${AUDITORIA_CHAVE_HEX:?Defina AUDITORIA_CHAVE_HEX}
      AUDITORIA_DIRETORIO: /app/.dados/auditoria
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Defina DEMO_PASSWORD}
    ports:
      - "3001:3001"
    volumes:
      - ./.dados/auditoria:/app/.dados/auditoria

volumes:
  postgres_data:
